<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon FireRed - EmulatorJS</title>
<style>
html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;box-sizing:border-box;padding:18px;text-align:center;background:#181818}
h1{margin:0 0 8px;font-size:24px}
p{margin:6px 0;color:#ccc}
#picker{margin:16px 0;padding:10px;background:#222;border:1px solid #444;border-radius:6px;color:#fff}
#game{width:min(960px,100vw);height:min(720px,75vw);min-height:480px;background:#000}
#status{margin:0 0 12px;color:#aaa;text-align:center}
</style>
</head>
<body>
<header>
<h1>Pokémon FireRed</h1>
<p>Select your legally obtained GBA ROM to play it in EmulatorJS.</p>
<input id="picker" type="file" accept=".gba">
<div id="status">Choose a .gba file to start.</div>
</header>
<div id="game"></div>
<script>
const picker=document.getElementById("picker");
const status=document.getElementById("status");
picker.addEventListener("change",function(){
  const file=this.files[0];
  if(!file)return;
  if(!file.name.toLowerCase().endsWith(".gba")){
    status.textContent="Please select a GBA ROM.";
    return;
  }
  const url=URL.createObjectURL(file);
  window.EJS_player="#game";
  window.EJS_core="gba";
  window.EJS_gameUrl=url;
  window.EJS_gameName=file.name;
  window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded=true;
  status.textContent="Loading "+file.name+"...";
  const script=document.createElement("script");
  script.src="https://cdn.emulatorjs.org/stable/data/loader.js";
  document.body.appendChild(script);
});
</script>
</body>
</html>
