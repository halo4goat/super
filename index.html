<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon FireRed</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}
header{padding:12px 16px;background:#181818;display:flex;align-items:center;gap:14px;box-sizing:border-box}
h1{font-size:18px;margin:0}
#pick{margin-left:auto;background:#fff;color:#111;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
#status{font-size:13px;color:#bbb}
#game{flex:1;min-height:0;width:100%;height:100%;background:#000}
.note{padding:8px 16px;background:#181818;color:#aaa;font-size:12px}
</style>
</head>
<body>
<header>
<h1>Pokémon FireRed</h1>
<span id="status">Choose your legally obtained .gba ROM to start.</span>
<input id="pick" type="file" accept=".gba,application/octet-stream">
</header>
<div id="game"></div>
<div class="note">The ROM is loaded locally in your browser and is not uploaded to the website.</div>
<script>
const input=document.getElementById('pick');
const status=document.getElementById('status');
let romUrl=null;
input.addEventListener('change',()=>{
 const file=input.files&&input.files[0];
 if(!file)return;
 if(!file.name.toLowerCase().endsWith('.gba')){
  status.textContent='Please choose a .gba Game Boy Advance ROM.';
  return;
 }
 if(romUrl)URL.revokeObjectURL(romUrl);
 romUrl=URL.createObjectURL(file);
 window.EJS_player='#game';
 window.EJS_core='gba';
 window.EJS_gameUrl=romUrl;
 window.EJS_gameName=file.name;
 window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
 window.EJS_startOnLoaded=true;
 status.textContent='Loading '+file.name+'...';
 document.getElementById('emulatorjs-loader')?.remove();
 const s=document.createElement('script');
 s.id='emulatorjs-loader';
 s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
 s.onload=()=>status.textContent='Emulator loaded.';
 s.onerror=()=>status.textContent='Could not load EmulatorJS.';
 document.body.appendChild(s);
});
</script>
</body>
</html>
